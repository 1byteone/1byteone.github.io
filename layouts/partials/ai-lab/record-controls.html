{{- $zh := .zh -}}
<div class="al-record-controls" id="archive-tools" data-lab-controls{{ with .active }} data-fixed-track="{{ . }}"{{ end }}>
  <label class="al-search-field"><span aria-hidden="true">⌕</span><input type="search" data-lab-search placeholder="{{ if $zh }}搜索标题、方法或技术关键词…{{ else }}Search titles, methods, or technologies…{{ end }}" aria-label="{{ if $zh }}搜索研究记录{{ else }}Search research records{{ end }}"><kbd>/</kbd></label>
  {{ if not .active }}<label class="al-select-field"><span>{{ if $zh }}研究方向{{ else }}TRACK{{ end }}</span><select data-category-filter aria-label="{{ if $zh }}按方向筛选{{ else }}Filter by track{{ end }}"><option value="all">{{ if $zh }}全部方向{{ else }}All tracks{{ end }}</option>{{ range .categories }}<option value="{{ .id }}">{{ if $zh }}{{ .label_zh }}{{ else }}{{ .label }}{{ end }}</option>{{ end }}</select></label>{{ end }}
  <label class="al-select-field"><span>{{ if $zh }}记录状态{{ else }}STATUS{{ end }}</span><select data-status-filter aria-label="{{ if $zh }}按状态筛选{{ else }}Filter by status{{ end }}"><option value="all">{{ if $zh }}全部状态{{ else }}All statuses{{ end }}</option><option value="planned">{{ if $zh }}待执行{{ else }}Planned{{ end }}</option><option value="running">{{ if $zh }}进行中{{ else }}Running{{ end }}</option><option value="completed">{{ if $zh }}已完成{{ else }}Completed{{ end }}</option><option value="failed">{{ if $zh }}失败复盘{{ else }}Failed{{ end }}</option><option value="archived">{{ if $zh }}已归档{{ else }}Archived{{ end }}</option><option value="published">{{ if $zh }}已发布{{ else }}Published{{ end }}</option></select></label>
  <label class="al-select-field al-sort-field"><span>{{ if $zh }}排序{{ else }}SORT BY{{ end }}</span><select data-sort-filter aria-label="{{ if $zh }}排序方式{{ else }}Sort records{{ end }}"><option value="recent">{{ if $zh }}最近更新{{ else }}Most recent{{ end }}</option><option value="title">{{ if $zh }}标题 A–Z{{ else }}Title A–Z{{ end }}</option><option value="reading">{{ if $zh }}阅读时间{{ else }}Reading time{{ end }}</option></select></label>
  <div class="al-view-switch" role="group" aria-label="{{ if $zh }}档案视图{{ else }}Archive view{{ end }}"><button type="button" data-view-choice="list" aria-pressed="true" title="{{ if $zh }}列表视图{{ else }}List view{{ end }}"><span class="al-view-icon al-view-icon-list" aria-hidden="true"></span><span class="al-sr-only">{{ if $zh }}列表{{ else }}List{{ end }}</span></button><button type="button" data-view-choice="grid" aria-pressed="false" title="{{ if $zh }}网格视图{{ else }}Grid view{{ end }}"><span class="al-view-icon al-view-icon-grid" aria-hidden="true"></span><span class="al-sr-only">{{ if $zh }}网格{{ else }}Grid{{ end }}</span></button></div>
  <p class="al-result-count" data-result-count aria-live="polite"></p>
</div>
