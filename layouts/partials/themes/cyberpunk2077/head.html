{{- $zh := hasPrefix .Lang "zh" -}}
{{- $site := .Site.Data.site.site -}}
<!doctype html>
<html lang="{{ if $zh }}zh-Hans{{ else }}en{{ end }}">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0b0d12"><meta name="author" content="{{ $site.identity.name_en }}">
  <meta name="description" content="{{ if .Description }}{{ .Description | plainify | htmlEscape }}{{ else if .Summary }}{{ .Summary | plainify | htmlEscape }}{{ else if $zh }}{{ $site.copy.zh.hero_note | htmlEscape }}{{ else }}{{ $site.copy.en.hero_note | htmlEscape }}{{ end }}">
  <link rel="icon" href="{{ "favicon.svg" | relURL }}" type="image/svg+xml">
  <link rel="shortcut icon" href="{{ "favicon.svg" | relURL }}" type="image/svg+xml">
  {{ if .Site.Params.theme_preview }}<meta name="robots" content="noindex,follow">{{ end }}
  <link rel="canonical" href="{{ .Permalink }}"><meta property="og:title" content="{{ if .Title }}{{ .Title }}{{ else }}YOYO / Night City Engineering{{ end }}"><meta property="og:description" content="{{ if .Description }}{{ .Description | plainify | htmlEscape }}{{ else if .Summary }}{{ .Summary | plainify | htmlEscape }}{{ else if $zh }}{{ $site.copy.zh.hero_note | htmlEscape }}{{ else }}{{ $site.copy.en.hero_note | htmlEscape }}{{ end }}"><meta property="og:url" content="{{ .Permalink }}">
  <link rel="stylesheet" href="{{ "css/cyberpunk2077.css" | relURL }}">
  {{ partial "rich-content/head.html" . }}
  <title>{{ if .IsHome }}YOYO / FIELD NOTES{{ else }}{{ .Title }} / YOYO ARCHIVE{{ end }}</title>
</head>
