{{- $zh := hasPrefix .Lang "zh" -}}
{{- $site := .Site.Data.site.site -}}
<!doctype html>
<html lang="{{ if $zh }}zh-Hans{{ else }}en{{ end }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050a08">
  <meta name="author" content="{{ $site.identity.name_en }}">
  <meta name="description" content="{{ .Description | default .Summary | plainify | htmlEscape }}">
  {{ if .Site.Params.theme_preview }}<meta name="robots" content="noindex,follow">{{ end }}
  <link rel="canonical" href="{{ .Permalink }}">
  <meta property="og:title" content="{{ if .IsHome }}{{ if $zh }}YOYO 像素终端{{ else }}YOYO / Pixel Terminal{{ end }}{{ else }}{{ .Title }} · YOYO Pixel Terminal{{ end }}">
  <meta property="og:description" content="{{ .Description | default .Summary | plainify | htmlEscape }}">
  <meta property="og:url" content="{{ .Permalink }}">
  <link rel="stylesheet" href="{{ "css/emil-pixel-terminal.css" | relURL }}?v=20261103-8">
  {{ partial "rich-content/head.html" . }}
  <title>{{ if .IsHome }}{{ if $zh }}YOYO 像素终端{{ else }}YOYO / Pixel Terminal{{ end }}{{ else }}{{ .Title }} · YOYO Pixel Terminal{{ end }}</title>
</head>
