<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#f6f6f4">
  <title>页面未找到 · 杨劲松</title>
  <style>
    :root{color-scheme:light;--ink:#171717;--muted:#727272;--line:#dededb;--accent:#e3242b;font-family:"Noto Sans SC","Microsoft YaHei",system-ui,sans-serif}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;color:var(--ink);background:#f6f6f4;display:grid;place-items:center;padding:24px}
    main{width:min(100%,720px);border-top:3px solid var(--accent);padding:32px 0}
    .code{margin:0 0 18px;color:var(--accent);font:600 14px/1.4 ui-monospace,monospace}
    h1{margin:0 0 12px;font-size:clamp(28px,6vw,48px);font-weight:600;line-height:1.15}
    p{max-width:48ch;margin:0;color:var(--muted);font-size:16px;line-height:1.7}
    nav{display:flex;flex-wrap:wrap;gap:10px 22px;margin-top:28px;padding-top:18px;border-top:1px solid var(--line)}
    a{color:var(--ink);text-underline-offset:4px}
    a:hover{color:var(--accent)}
    @media(max-width:480px){body{padding:20px}main{padding-top:26px}}
  </style>
</head>
<body>
  <main>
    <p class="code">404 / 页面未找到</p>
    <h1>这条工程记录暂时不存在。</h1>

    <nav aria-label="站点导航">

      <a href="/projects/index.html">项目档案</a>

</body>
</html>
