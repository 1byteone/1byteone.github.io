policies:
  baseline: "Content renders with shared Markdown/Hugo behavior and does not require a theme-specific component."
  fallback: "The article must expose a static, readable representation when the theme lacks an enhancement."
  interactive: "Interactive content requires an allowlisted source, keyboard behavior, reduced-motion support, and a tested fallback."
