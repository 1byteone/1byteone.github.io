story_records:
  - title: "夜之城时间线"
    title_en: "Night City timeline"
    type: "TIMELINE / WORLD"
    type_en: "TIMELINE / WORLD"
    summary: "从企业战争、城市重建到 2077 年的关键节点，按自己的笔记重新整理。"
    summary_en: "Original notes on the major milestones from corporate wars and reconstruction to 2077."
    source: "Cyberpunk Wiki / Timeline"
    url: "https://cyberpunk.fandom.com/wiki/Timeline"
  - title: "人物关系索引"
    title_en: "Character relationship index"
    type: "CHARACTERS / RELATIONS"
    type_en: "CHARACTERS / RELATIONS"
    summary: "记录 V、Johnny、Judy、Panam 等人物的身份、关系和剧情交叉点。"
    summary_en: "A personal index of identities, relationships, and story intersections around V, Johnny, Judy, and Panam."
    source: "Narrative Atlas"
    url: "https://www.narrativeatlas.com/"
  - title: "Shards 与邮件档案"
    title_en: "Shards and message archive"
    type: "SHARDS / TEXT INDEX"
    type_en: "SHARDS / TEXT INDEX"
    summary: "只保留自己的摘要与关键词，不复制游戏内原文。"
    summary_en: "Only original summaries and keywords are kept here; game text is not reproduced."
    source: "Immersion Wiki"
    url: "https://immersion.wiki/"
  - title: "企业与帮派档案"
    title_en: "Corporations and gangs"
    type: "FACTIONS / POWER"
    type_en: "FACTIONS / POWER"
    summary: "从企业、帮派、地盘和利益关系观察夜之城的权力结构。"
    summary_en: "A personal reading of Night City's power structures through corporations, gangs, territories, and interests."
    source: "Cyberpunk Wiki"
    url: "https://cyberpunk.fandom.com/wiki/Cyberpunk_Wiki"

music_records:
