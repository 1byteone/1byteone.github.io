name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches:
      - main
      - dev_theme_oil
      - dev_theme_AIxian

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash


jobs:
  build:
    runs-on: ubuntu-latest

    env:
      HUGO_VERSION: 0.162.0

    steps:
      # 安装 Hugo CLI
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb \
            https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb

          sudo dpkg -i ${{ runner.temp }}/hugo.deb


      # 拉取源码
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0


      # 安装 Go 环境
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"


      # 安装 Node 依赖
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci


      # 配置 GitHub Pages
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5


      # Hugo 构建
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: America/New_York

        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      # Publish the preview theme in the same Pages artifact so the site can
      # switch themes by URL without requiring a second repository or deploy.
      - name: Build Oil theme preview
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: oil
          TZ: America/New_York
        run: |
          rm -rf "public/themes/oil"
          hugo \
            --gc \
            --minify \
            --cleanDestinationDir \
            --environment oil \
            --configDir config \
            --destination public/themes/oil \
            --baseURL "${{ steps.pages.outputs.base_url }}/themes/oil/"

      - name: Build Minimal theme preview
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: minimal
          TZ: America/New_York
        run: |
          rm -rf "public/themes/minimal"
          hugo \
            --gc \
            --minify \
            --cleanDestinationDir \
            --environment minimal \
            --configDir config \
            --destination public/themes/minimal \
            --baseURL "${{ steps.pages.outputs.base_url }}/themes/minimal/"

      - name: Build alxian theme preview
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: alxian
          TZ: America/New_York
        run: |
          rm -rf "public/themes/alxian"
          hugo \
            --gc \
            --minify \
            --cleanDestinationDir \
            --environment alxian \
            --configDir config \
            --destination public/themes/alxian \
            --baseURL "${{ steps.pages.outputs.base_url }}/themes/alxian/"

      - name: Verify theme route matrix
        run: |
          set -euo pipefail
          for route in \
            "index.html" \
            "works/index.html" \
            "blog/index.html" \
            "resource/index.html" \
            "chat/index.html" \
            "friends/index.html" \
            "tech-stack/index.html" \
            "en/index.html" \
            "en/works/index.html" \
            "en/blog/index.html" \
            "en/resource/index.html" \
            "en/chat/index.html" \
            "en/friends/index.html" \
            "en/tech-stack/index.html"; do
            test -s "public/themes/alxian/$route"
          done
          test -s public/themes/alxian/css/alxian-theme.css
          test -s public/themes/alxian/css/alxian-pages.css
          test -s public/themes/alxian/js/alxian-theme.js
          test -s public/themes/alxian/js/alxian-pages.js
          test -s public/themes/oil/index.html
          test -s public/themes/oil/en/index.html
          test -s public/themes/oil/css/oil-theme.css

      - name: Build search index
        run: npm run pagefind


      # 上传构建产物
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public



  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:
      # 部署到 GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
