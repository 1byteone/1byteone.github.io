name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches:
      - main
      - dev_theme_oil
      - dev_theme_AIxian
      - dev_theme_GPT
      - dev_theme_min
      - dev_theme_minimal-tech
      - dev_theme_engineer-terminal
      - dev_termfolio
      - dev_theme_cyberpunk2077
      - dev_theme_lzw_archive
      - dev_matthewtrent_clone

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash


jobs:
  build:
    runs-on: ubuntu-latest

    env:
      HUGO_VERSION: 0.162.0

    steps:
      # 安装 Hugo CLI
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb \
            https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb

          sudo dpkg -i ${{ runner.temp }}/hugo.deb


      # 拉取源码
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0


      # 安装 Go 环境
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"


      # 安装 Node 依赖
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci


      # 配置 GitHub Pages
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5


      # Hugo 构建
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: America/New_York

        run: |
          hugo \
            --gc \
            --cleanDestinationDir \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      # Publish the preview theme in the same Pages artifact so the site can
      # switch themes by URL without requiring a second repository or deploy.
      - name: Build Oil theme preview
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: oil
          TZ: America/New_York
        run: |
          rm -rf "public/themes/oil"
          hugo \
            --gc \
            --minify \
            --cleanDestinationDir \
            --environment oil \
            --configDir config \
            --destination public/themes/oil \
            --baseURL "${{ steps.pages.outputs.base_url }}/themes/oil/"

      - name: Build Minimal theme preview
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: minimal
          TZ: America/New_York
        run: |
          rm -rf "public/themes/minimal"
          hugo \
            --gc \
            --minify \
            --cleanDestinationDir \
            --environment minimal \
            --configDir config \
            --destination public/themes/minimal \
            --baseURL "${{ steps.pages.outputs.base_url }}/themes/minimal/"

      - name: Build alxian theme preview
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: alxian
          TZ: America/New_York
        run: |
          rm -rf "public/themes/alxian"
          hugo \
            --gc \
            --minify \
            --cleanDestinationDir \
            --environment alxian \
            --configDir config \
            --destination public/themes/alxian \
            --baseURL "${{ steps.pages.outputs.base_url }}/themes/alxian/"

      - name: Build BlogGPT theme preview
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: bloggpt
          TZ: America/New_York
        run: |
          rm -rf "public/themes/bloggpt"
          hugo \
            --gc \
            --minify \
            --cleanDestinationDir \
            --environment bloggpt \
            --configDir config \
            --destination public/themes/bloggpt \
            --baseURL "${{ steps.pages.outputs.base_url }}/themes/bloggpt/"

      - name: Build Engineer Terminal theme preview
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: engineer-terminal
          TZ: America/New_York
        run: |
          rm -rf "public/themes/engineer-terminal"
          hugo \
            --gc \
            --minify \
            --cleanDestinationDir \
            --environment engineer-terminal \
            --configDir config \
            --destination public/themes/engineer-terminal \
            --baseURL "${{ steps.pages.outputs.base_url }}/themes/engineer-terminal/"

      - name: Build Cyberpunk 2077 theme preview
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: cyberpunk2077
          TZ: America/New_York
        run: |
          rm -rf "public/themes/cyberpunk2077"
          hugo \
            --gc \
            --minify \
            --cleanDestinationDir \
            --environment cyberpunk2077 \
            --configDir config \
            --destination public/themes/cyberpunk2077 \
            --baseURL "${{ steps.pages.outputs.base_url }}/themes/cyberpunk2077/"

      - name: Build LZW Archive theme preview
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: lzw-archive
          TZ: America/New_York
        run: |
          rm -rf "public/themes/lzw-archive"
          hugo \
            --gc \
            --minify \
            --cleanDestinationDir \
            --environment lzw-archive \
            --configDir config \
            --destination public/themes/lzw-archive \
            --baseURL "${{ steps.pages.outputs.base_url }}/themes/lzw-archive/"

      - name: Build Astro TUI terminal preview
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: astro-tui-portfolio
          TZ: America/New_York
        run: |
          rm -rf "public/themes/engineer-terminal/astro-tui-portfolio"
          hugo \
            --gc \
            --minify \
            --cleanDestinationDir \
            --environment astro-tui-portfolio \
            --configDir config \
            --destination public/themes/engineer-terminal/astro-tui-portfolio \
            --baseURL "${{ steps.pages.outputs.base_url }}/themes/engineer-terminal/astro-tui-portfolio/"

      - name: Build Emil Pixel terminal preview
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: emil-pixel-terminal
          TZ: America/New_York
        run: |
          rm -rf "public/themes/engineer-terminal/emil-pixel-terminal"
          hugo \
            --gc \
            --minify \
            --cleanDestinationDir \
            --environment emil-pixel-terminal \
            --configDir config \
            --destination public/themes/engineer-terminal/emil-pixel-terminal \
            --baseURL "${{ steps.pages.outputs.base_url }}/themes/engineer-terminal/emil-pixel-terminal/"

      - name: Build Termfolio static terminal preview
        if: github.ref == 'refs/heads/dev_termfolio' || github.ref == 'refs/heads/dev_matthewtrent_clone'
        working-directory: termfolio
        env:
          TERMFOLIO_BASE_PATH: /themes/engineer-terminal/termfolio
        run: |
          set -euo pipefail
          npm ci
          bash scripts/build-pages-preview.sh
          rm -rf ../public/themes/engineer-terminal/termfolio
          mkdir -p ../public/themes/engineer-terminal/termfolio
          cp -R out/. ../public/themes/engineer-terminal/termfolio/

      - name: Build Minimal family previews
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: America/New_York
        run: |
          set -euo pipefail
          for variant in astro-blog astropaper astro-erudite pudding miniblog; do
            target="public/themes/minimal/${variant}"
            rm -rf "$target"
            hugo --gc --minify --cleanDestinationDir \
              --environment "minimal-${variant}" \
              --configDir config \
              --destination "$target" \
              --baseURL "${{ steps.pages.outputs.base_url }}/themes/minimal/${variant}/"
          done

      # Each Hugo preview inherits the shared static directory. Keep only the
      # asset families that a preview can actually render so the Pages artifact
      # stays deployable instead of repeating several hundred MB per theme.
      - name: Prune duplicated preview assets
        run: |
          set -euo pipefail

          remove_all_except() {
            local pattern="$1"
            local keep="$2"
            while IFS= read -r dir; do
              [ -n "$dir" ] || continue
              case "$dir" in
                "$keep") ;;
                *) rm -rf "$dir" ;;
              esac
            done < <(find public/themes -type d -path "$pattern" -print)
          }

          remove_all_except '*/linear-mirror' ''
          remove_all_except '*/assets' 'public/themes/alxian/assets'
          remove_all_except '*/media/cyberpunk2077' 'public/themes/cyberpunk2077/media/cyberpunk2077'
          remove_all_except '*/images/emil-pixel-terminal' 'public/themes/engineer-terminal/emil-pixel-terminal/images/emil-pixel-terminal'

          # Legacy mirror galleries are not referenced by any theme route.
          # Article and roadmap media remain available for the actual content
          # pages, while these two unused buckets would be copied repeatedly.
          find public/themes -type d \( -path '*/media/blog' -o -path '*/media/projects' \) -prune -exec rm -rf {} +

          # The Cyberpunk preview only renders the local hero, profile logo,
          # six card images, and the Night City hobby backdrop. The source
          # archive also contains raw region sheets and unrelated official
          # reference material; keeping those in every preview is wasteful.
          cp_media="public/themes/cyberpunk2077/media/cyberpunk2077"
          if [ -d "$cp_media" ]; then
            find "$cp_media/official" -type f ! -name 'hero-ultimate-edition-animation.webm' ! -name 'night-city-vista-zh.png' -delete
            find "$cp_media/ui/regions" "$cp_media/ui/source" "$cp_media/ui/granular" "$cp_media/ui/components" -type f -delete 2>/dev/null || true
            find "$cp_media/ui" -maxdepth 1 -type f ! -name 'hero-desktop.webp' ! -name 'hero-mobile.webp' ! -name 'card-hero-vertical.webp' ! -name 'card-johnny.webp' ! -name 'card-night-city.webp' ! -name 'card-night-city-day.webp' ! -name 'card-japantown.webp' ! -name 'card-black-sapphire.webp' ! -name 'card-street-view.webp' -delete
            find "$cp_media/ui/derived" -type f ! -name 'logo-tight-transparent.png' -delete 2>/dev/null || true
          fi

          total_bytes=$(find public -type f -printf '%s\n' | awk '{ total += $1 } END { print total + 0 }')
          # The Pages action compresses this tree before upload; keep a
          # conservative raw-tree ceiling below the service artifact limit.
          max_bytes=$((1200 * 1024 * 1024))
          if [ "$total_bytes" -ge "$max_bytes" ]; then
            echo "Pages artifact is too large: ${total_bytes} bytes" >&2
            exit 1
          fi
          echo "Pages artifact size: ${total_bytes} bytes"

      - name: Verify Minimal family previews
        run: |
          set -euo pipefail
          test -s "public/themes/minimal/index.html"
          test -s "public/themes/minimal/en/index.html"
          test -s "public/themes/minimal/blog/rag-basic-pipeline/index.html"
          test -s "public/themes/minimal/en/blog/rag-basic-pipeline/index.html"
          test -s "public/theme-center/index.html"
          test -s "public/en/theme-center/index.html"
          test -s "public/themes/minimal/css/minimal-theme.css"
          for variant in astro-blog astropaper astro-erudite pudding miniblog; do
            test -s "public/themes/minimal/${variant}/index.html"
            test -s "public/themes/minimal/${variant}/en/index.html"
            test -s "public/themes/minimal/${variant}/blog/rag-basic-pipeline/index.html"
            test -s "public/themes/minimal/${variant}/en/blog/rag-basic-pipeline/index.html"
            test -s "public/themes/minimal/${variant}/css/minimal-theme.css"
          done

      - name: Verify theme route matrix
        run: |
          set -euo pipefail
          for cover in public/images/theme-center/*.webp; do
            test -s "$cover"
          done
          test -s public/themes/engineer-terminal/images/theme-center/ai-terminal.webp
          test -s public/themes/bloggpt/images/theme-center/bloggpt.webp
          test -s public/themes/cyberpunk2077/images/theme-center/cyberpunk2077.webp
          for route in \
            "index.html" \
            "works/index.html" \
            "blog/index.html" \
            "resource/index.html" \
            "chat/index.html" \
            "friends/index.html" \
            "tech-stack/index.html" \
            "en/index.html" \
            "en/works/index.html" \
            "en/blog/index.html" \
            "en/resource/index.html" \
            "en/chat/index.html" \
            "en/friends/index.html" \
            "en/tech-stack/index.html"; do
            test -s "public/themes/alxian/$route"
          done
          test -s public/themes/alxian/css/alxian-theme.css
          test -s public/themes/alxian/css/alxian-pages.css
          test -s public/themes/alxian/js/alxian-theme.js
          test -s public/themes/alxian/js/alxian-pages.js
          test -s public/themes/oil/index.html
          test -s public/themes/oil/en/index.html
          test -s public/themes/oil/css/oil-theme.css
          test -s public/themes/bloggpt/index.html
          test -s public/themes/bloggpt/en/index.html
          test -s public/themes/bloggpt/css/bloggpt-theme.css
          test -s public/themes/engineer-terminal/index.html
          test -s public/themes/engineer-terminal/en/index.html
          test -s public/themes/engineer-terminal/blog/index.html
          test -s public/themes/engineer-terminal/projects/index.html
          test -s public/themes/engineer-terminal/logs/index.html
          test -s public/themes/engineer-terminal/incidents/index.html
          test -s public/themes/engineer-terminal/decisions/index.html
          test -s public/themes/engineer-terminal/en/incidents/index.html
          test -s public/themes/engineer-terminal/en/decisions/index.html
          test -s public/themes/engineer-terminal/css/engineer-terminal.css
          test -s public/themes/engineer-terminal/js/engineer-terminal.js
          test -s public/themes/cyberpunk2077/index.html
          test -s public/themes/cyberpunk2077/en/index.html
          test -s public/themes/cyberpunk2077/blog/index.html
          test -s public/themes/cyberpunk2077/projects/index.html
          test -s public/themes/cyberpunk2077/blog/rag-production-architecture/index.html
          test -s public/themes/cyberpunk2077/css/cyberpunk2077.css
          test -s public/themes/cyberpunk2077/js/cyberpunk2077.js
          test -s public/themes/lzw-archive/index.html
          test -s public/themes/lzw-archive/about.html
          test -s public/themes/lzw-archive/resume.html
          test -s public/themes/lzw-archive/lzw-archive.css
          test -s public/themes/lzw-archive/lzw-archive.js
          test -s public/themes/engineer-terminal/css/theme-center.css
          test -s public/themes/engineer-terminal/astro-tui-portfolio/index.html
          test -s public/themes/engineer-terminal/astro-tui-portfolio/en/index.html
          test -s public/themes/engineer-terminal/astro-tui-portfolio/blog/index.html
          test -s public/themes/engineer-terminal/astro-tui-portfolio/blog/fastapi-ai-streaming-api/index.html
          test -s public/themes/engineer-terminal/astro-tui-portfolio/en/blog/fastapi-ai-streaming-api/index.html
          test -s public/themes/engineer-terminal/astro-tui-portfolio/css/astro-tui.css
          test -s public/themes/engineer-terminal/astro-tui-portfolio/js/astro-tui.js
          test -s public/themes/engineer-terminal/emil-pixel-terminal/index.html
          test -s public/themes/engineer-terminal/emil-pixel-terminal/en/index.html
          test -s public/themes/engineer-terminal/emil-pixel-terminal/blog/index.html
          test -s public/themes/engineer-terminal/emil-pixel-terminal/blog/fastapi-ai-streaming-api/index.html
          test -s public/themes/engineer-terminal/emil-pixel-terminal/css/emil-pixel-terminal.css
          test -s public/themes/engineer-terminal/emil-pixel-terminal/js/emil-pixel-terminal.js
          if [[ "${{ github.ref }}" == "refs/heads/dev_termfolio" || "${{ github.ref }}" == "refs/heads/dev_matthewtrent_clone" ]]; then
            test -s public/themes/engineer-terminal/termfolio/index.html
            test -s public/themes/engineer-terminal/termfolio/blog/index.html
            test -s public/themes/engineer-terminal/termfolio/blog/fastapi-ai-streaming-api/index.html
            test -s public/themes/engineer-terminal/termfolio/engineer-terminal-avatar.png
            test -s public/themes/engineer-terminal/termfolio/images/blog/bitmap/bitmap-planet-earth.png
          fi
          test -s public/themes/minimal/index.html
          test -s public/themes/minimal/en/index.html
          test -s public/themes/minimal/blog/rag-basic-pipeline/index.html
          test -s public/themes/minimal/en/blog/rag-basic-pipeline/index.html
          test -s public/themes/minimal/css/minimal-theme.css
          test -s public/index.html
          test -s public/about.html
          test -s public/resume.html
          test -s public/lzw-archive.css
          test -s public/lzw-archive.js

      - name: Verify BlogGPT routes
        if: github.ref == 'refs/heads/dev_theme_GPT'
        run: |
          set -euo pipefail
          for route in \
            "index.html" \
            "blog/index.html" \
            "projects/index.html" \
            "resource/index.html" \
            "friends/index.html" \
            "categories/index.html" \
            "archives/index.html" \
            "about/index.html" \
            "search/index.html" \
            "status/index.html" \
            "chat/index.html" \
            "tech-stack/index.html" \
            "en/index.html" \
            "en/blog/index.html" \
            "en/projects/index.html" \
            "en/about/index.html"; do
            test -s "public/$route"
          done
          test -s public/css/bloggpt-theme.css
          test -s public/js/bloggpt-theme.js
          test -s public/blog/building-rag-pipeline/index.html

      - name: Build search index
        run: npm run pagefind


      # 上传构建产物
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public



  deploy:
    if: >-
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/dev_theme_oil' ||
      github.ref == 'refs/heads/dev_theme_AIxian' ||
      github.ref == 'refs/heads/dev_theme_GPT' ||
      github.ref == 'refs/heads/dev_theme_min' ||
      github.ref == 'refs/heads/dev_theme_minimal-tech' ||
      github.ref == 'refs/heads/dev_theme_engineer-terminal' ||
      github.ref == 'refs/heads/dev_termfolio' ||
      github.ref == 'refs/heads/dev_theme_cyberpunk2077' ||
      github.ref == 'refs/heads/dev_theme_lzw_archive' ||
      github.ref == 'refs/heads/dev_matthewtrent_clone'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:
      # 部署到 GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
