name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches:
      - main
      - dev_theme_oil
      - dev_theme_AIxian
      - dev_theme_GPT
      - dev_theme_min
      - dev_theme_minimal-tech
      - dev_theme_engineer-terminal
      - dev_termfolio

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash


jobs:
  build:
    runs-on: ubuntu-latest

    env:
      HUGO_VERSION: 0.162.0

    steps:
      # 安装 Hugo CLI
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb \
            https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb

          sudo dpkg -i ${{ runner.temp }}/hugo.deb


      # 拉取源码
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0


      # 安装 Go 环境
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"


      # 安装 Node 依赖
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci


      # 配置 GitHub Pages
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5


      # Hugo 构建
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: America/New_York

        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      # Publish the preview theme in the same Pages artifact so the site can
      # switch themes by URL without requiring a second repository or deploy.
      - name: Build Oil theme preview
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: oil
          TZ: America/New_York
        run: |
          rm -rf "public/themes/oil"
          hugo \
            --gc \
            --minify \
            --cleanDestinationDir \
            --environment oil \
            --configDir config \
            --destination public/themes/oil \
            --baseURL "${{ steps.pages.outputs.base_url }}/themes/oil/"

      - name: Build Minimal theme preview
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: minimal
          TZ: America/New_York
        run: |
          rm -rf "public/themes/minimal"
          hugo \
            --gc \
            --minify \
            --cleanDestinationDir \
            --environment minimal \
            --configDir config \
            --destination public/themes/minimal \
            --baseURL "${{ steps.pages.outputs.base_url }}/themes/minimal/"

      - name: Build alxian theme preview
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: alxian
          TZ: America/New_York
        run: |
          rm -rf "public/themes/alxian"
          hugo \
            --gc \
            --minify \
            --cleanDestinationDir \
            --environment alxian \
            --configDir config \
            --destination public/themes/alxian \
            --baseURL "${{ steps.pages.outputs.base_url }}/themes/alxian/"

      - name: Build BlogGPT theme preview
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: bloggpt
          TZ: America/New_York
        run: |
          rm -rf "public/themes/bloggpt"
          hugo \
            --gc \
            --minify \
            --cleanDestinationDir \
            --environment bloggpt \
            --configDir config \
            --destination public/themes/bloggpt \
            --baseURL "${{ steps.pages.outputs.base_url }}/themes/bloggpt/"

      - name: Build Engineer Terminal theme preview
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: engineer-terminal
          TZ: America/New_York
        run: |
          rm -rf "public/themes/engineer-terminal"
          hugo \
            --gc \
            --minify \
            --cleanDestinationDir \
            --environment engineer-terminal \
            --configDir config \
            --destination public/themes/engineer-terminal \
            --baseURL "${{ steps.pages.outputs.base_url }}/themes/engineer-terminal/"

      - name: Build Astro TUI terminal preview
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: astro-tui-portfolio
          TZ: America/New_York
        run: |
          rm -rf "public/themes/engineer-terminal/astro-tui-portfolio"
          hugo \
            --gc \
            --minify \
            --cleanDestinationDir \
            --environment astro-tui-portfolio \
            --configDir config \
            --destination public/themes/engineer-terminal/astro-tui-portfolio \
            --baseURL "${{ steps.pages.outputs.base_url }}/themes/engineer-terminal/astro-tui-portfolio/"

      - name: Build Termfolio static terminal preview
        if: github.ref == 'refs/heads/dev_termfolio'
        working-directory: termfolio
        env:
          TERMFOLIO_BASE_PATH: /themes/engineer-terminal/termfolio
        run: |
          set -euo pipefail
          npm ci
          bash scripts/build-pages-preview.sh
          rm -rf ../public/themes/engineer-terminal/termfolio
          mkdir -p ../public/themes/engineer-terminal/termfolio
          cp -R out/. ../public/themes/engineer-terminal/termfolio/

      - name: Build Minimal family previews
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: America/New_York
        run: |
          set -euo pipefail
          for variant in astro-blog astropaper astro-erudite pudding miniblog; do
            target="public/themes/minimal/${variant}"
            rm -rf "$target"
            hugo --gc --minify --cleanDestinationDir \
              --environment "minimal-${variant}" \
              --configDir config \
              --destination "$target" \
              --baseURL "${{ steps.pages.outputs.base_url }}/themes/minimal/${variant}/"
          done

      - name: Verify Minimal family previews
        run: |
          set -euo pipefail
          test -s "public/themes/minimal/index.html"
          test -s "public/themes/minimal/en/index.html"
          test -s "public/themes/minimal/blog/rag-basic-pipeline/index.html"
          test -s "public/themes/minimal/en/blog/rag-basic-pipeline/index.html"
          test -s "public/theme-center/index.html"
          test -s "public/en/theme-center/index.html"
          test -s "public/themes/minimal/css/minimal-theme.css"
          for variant in astro-blog astropaper astro-erudite pudding miniblog; do
            test -s "public/themes/minimal/${variant}/index.html"
            test -s "public/themes/minimal/${variant}/en/index.html"
            test -s "public/themes/minimal/${variant}/blog/rag-basic-pipeline/index.html"
            test -s "public/themes/minimal/${variant}/en/blog/rag-basic-pipeline/index.html"
            test -s "public/themes/minimal/${variant}/css/minimal-theme.css"
          done

      - name: Verify theme route matrix
        run: |
          set -euo pipefail
          for route in \
            "index.html" \
            "works/index.html" \
            "blog/index.html" \
            "resource/index.html" \
            "chat/index.html" \
            "friends/index.html" \
            "tech-stack/index.html" \
            "en/index.html" \
            "en/works/index.html" \
            "en/blog/index.html" \
            "en/resource/index.html" \
            "en/chat/index.html" \
            "en/friends/index.html" \
            "en/tech-stack/index.html"; do
            test -s "public/themes/alxian/$route"
          done
          test -s public/themes/alxian/css/alxian-theme.css
          test -s public/themes/alxian/css/alxian-pages.css
          test -s public/themes/alxian/js/alxian-theme.js
          test -s public/themes/alxian/js/alxian-pages.js
          test -s public/themes/oil/index.html
          test -s public/themes/oil/en/index.html
          test -s public/themes/oil/css/oil-theme.css
          test -s public/themes/bloggpt/index.html
          test -s public/themes/bloggpt/en/index.html
          test -s public/themes/bloggpt/css/bloggpt-theme.css
          test -s public/themes/engineer-terminal/index.html
          test -s public/themes/engineer-terminal/en/index.html
          test -s public/themes/engineer-terminal/blog/index.html
          test -s public/themes/engineer-terminal/projects/index.html
          test -s public/themes/engineer-terminal/logs/index.html
          test -s public/themes/engineer-terminal/incidents/index.html
          test -s public/themes/engineer-terminal/decisions/index.html
          test -s public/themes/engineer-terminal/en/incidents/index.html
          test -s public/themes/engineer-terminal/en/decisions/index.html
          test -s public/themes/engineer-terminal/css/engineer-terminal.css
          test -s public/themes/engineer-terminal/js/engineer-terminal.js
          test -s public/themes/engineer-terminal/css/theme-center.css
          test -s public/themes/engineer-terminal/astro-tui-portfolio/index.html
          test -s public/themes/engineer-terminal/astro-tui-portfolio/en/index.html
          test -s public/themes/engineer-terminal/astro-tui-portfolio/blog/index.html
          test -s public/themes/engineer-terminal/astro-tui-portfolio/blog/fastapi-ai-streaming-api/index.html
          test -s public/themes/engineer-terminal/astro-tui-portfolio/en/blog/fastapi-ai-streaming-api/index.html
          test -s public/themes/engineer-terminal/astro-tui-portfolio/css/astro-tui.css
          test -s public/themes/engineer-terminal/astro-tui-portfolio/js/astro-tui.js
          if [[ "${{ github.ref }}" == "refs/heads/dev_termfolio" ]]; then
            test -s public/themes/engineer-terminal/termfolio/index.html
            test -s public/themes/engineer-terminal/termfolio/blog/index.html
            test -s public/themes/engineer-terminal/termfolio/blog/fastapi-ai-streaming-api/index.html
            test -s public/themes/engineer-terminal/termfolio/engineer-terminal-avatar.png
            test -s public/themes/engineer-terminal/termfolio/images/blog/bitmap/bitmap-planet-earth.png
          fi
          test -s public/themes/minimal/index.html
          test -s public/themes/minimal/en/index.html
          test -s public/themes/minimal/blog/rag-basic-pipeline/index.html
          test -s public/themes/minimal/en/blog/rag-basic-pipeline/index.html
          test -s public/themes/minimal/css/minimal-theme.css

      - name: Verify BlogGPT routes
        if: github.ref == 'refs/heads/dev_theme_GPT'
        run: |
          set -euo pipefail
          for route in \
            "index.html" \
            "blog/index.html" \
            "projects/index.html" \
            "resource/index.html" \
            "friends/index.html" \
            "categories/index.html" \
            "archives/index.html" \
            "about/index.html" \
            "search/index.html" \
            "status/index.html" \
            "chat/index.html" \
            "tech-stack/index.html" \
            "en/index.html" \
            "en/blog/index.html" \
            "en/projects/index.html" \
            "en/about/index.html"; do
            test -s "public/$route"
          done
          test -s public/css/bloggpt-theme.css
          test -s public/js/bloggpt-theme.js
          test -s public/blog/building-rag-pipeline/index.html

      - name: Build search index
        run: npm run pagefind


      # 上传构建产物
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public



  deploy:
    if: >-
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/dev_theme_oil' ||
      github.ref == 'refs/heads/dev_theme_AIxian' ||
      github.ref == 'refs/heads/dev_theme_GPT' ||
      github.ref == 'refs/heads/dev_theme_min' ||
      github.ref == 'refs/heads/dev_theme_minimal-tech' ||
      github.ref == 'refs/heads/dev_theme_engineer-terminal' ||
      github.ref == 'refs/heads/dev_termfolio'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:
      # 部署到 GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
