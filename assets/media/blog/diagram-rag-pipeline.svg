<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <filter id="sketch"><feTurbulence type="turbulence" baseFrequency="0.02" numOctaves="3" result="turbulence"/><feDisplacementMap in="SourceGraphic" in2="turbulence" scale="1.5" xChannelSelector="R" yChannelSelector="G"/></filter>
  </defs>
  <rect width="1200" height="630" fill="#ffffff"/>
  <g filter="url(#sketch)">
  <text x="600" y="50" text-anchor="middle" fill="#2d3142" font-family="'Comic Sans MS', 'Marker Felt', cursive" font-size="28" font-weight="700">Production RAG Pipeline</text>
  <text x="600" y="72" text-anchor="middle" fill="#4f5d75" font-family="'Comic Sans MS', cursive" font-size="14">Ingestion → Embedding → Retrieval → Augmentation → Generation</text>

  <!-- Stage 1: Document Ingestion -->
  <rect x="40" y="100" width="200" height="160" rx="10" fill="#fff" stroke="#2d3142" stroke-width="2.5"/>
  <rect x="40" y="100" width="200" height="28" rx="10" fill="#e3f2fd"/>
  <rect x="40" y="118" width="200" height="10" fill="#e3f2fd"/>
  <text x="140" y="120" text-anchor="middle" fill="#1565c0" font-family="'Comic Sans MS', cursive" font-size="12" font-weight="700">1. Document Ingestion</text>
  <text x="140" y="148" text-anchor="middle" fill="#2d3142" font-family="'Comic Sans MS', cursive" font-size="10">PDF · DOCX · TXT</text>
  <text x="140" y="164" text-anchor="middle" fill="#2d3142" font-family="'Comic Sans MS', cursive" font-size="10">Markdown · Web Page</text>
  <text x="140" y="188" text-anchor="middle" fill="#2d3142" font-family="'Comic Sans MS', cursive" font-size="10">Document Loader</text>
  <text x="140" y="204" text-anchor="middle" fill="#2d3142" font-family="'Comic Sans MS', cursive" font-size="10">Text Splitter</text>
  <text x="140" y="224" text-anchor="middle" fill="#4f5d75" font-family="'Comic Sans MS', cursive" font-size="9">Chunk Size: 500 · Overlap: 50</text>
  <text x="140" y="244" text-anchor="middle" fill="#2d3142" font-family="'Comic Sans MS', cursive" font-size="10">Text Chunks</text>

  <path d="M 240 180 L 280 180" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

  <!-- Stage 2: Embedding -->
  <rect x="290" y="100" width="200" height="160" rx="10" fill="#fff" stroke="#2d3142" stroke-width="2.5"/>
  <rect x="290" y="100" width="200" height="28" rx="10" fill="#f3e5f5"/>
  <rect x="290" y="118" width="200" height="10" fill="#f3e5f5"/>
  <text x="390" y="120" text-anchor="middle" fill="#7b1fa2" font-family="'Comic Sans MS', cursive" font-size="12" font-weight="700">2. Embedding</text>
  <text x="390" y="148" text-anchor="middle" fill="#2d3142" font-family="'Comic Sans MS', cursive" font-size="10">Embedding Model</text>
  <text x="390" y="168" text-anchor="middle" fill="#4f5d75" font-family="'Comic Sans MS', cursive" font-size="9">[0.12, -0.34, 0.87...]</text>
  <text x="390" y="192" text-anchor="middle" fill="#2d3142" font-family="'Comic Sans MS', cursive" font-size="10">Vector Database</text>
  <text x="390" y="212" text-anchor="middle" fill="#4f5d75" font-family="'Comic Sans MS', cursive" font-size="9">ChromaDB / Redis</text>
  <text x="390" y="240" text-anchor="middle" fill="#2d3142" font-family="'Comic Sans MS', cursive" font-size="10">Vector Space</text>

  <path d="M 490 180 L 530 180" stroke="#7b1fa2" stroke-width="2.5" marker-end="url(#arrow-purple)"/>

  <!-- Stage 3: Retrieval -->
  <rect x="540" y="100" width="200" height="160" rx="10" fill="#fff" stroke="#2d3142" stroke-width="2.5"/>
  <rect x="540" y="100" width="200" height="28" rx="10" fill="#fff3e0"/>
  <rect x="540" y="118" width="200" height="10" fill="#fff3e0"/>
  <text x="640" y="120" text-anchor="middle" fill="#e65100" font-family="'Comic Sans MS', cursive" font-size="12" font-weight="700">3. Retrieval</text>
  <text x="640" y="148" text-anchor="middle" fill="#2d3142" font-family="'Comic Sans MS', cursive" font-size="10">User Query</text>
  <text x="640" y="168" text-anchor="middle" fill="#2d3142" font-family="'Comic Sans MS', cursive" font-size="10">Query Embedding</text>
  <text x="640" y="192" text-anchor="middle" fill="#2d3142" font-family="'Comic Sans MS', cursive" font-size="10">Similarity Search</text>
  <text x="640" y="212" text-anchor="middle" fill="#2d3142" font-family="'Comic Sans MS', cursive" font-size="10">Top-K Documents</text>
  <text x="640" y="240" text-anchor="middle" fill="#2e7d32" font-family="'Comic Sans MS', cursive" font-size="10">Relevant Chunks</text>

  <path d="M 740 180 L 780 180" stroke="#e65100" stroke-width="2.5" marker-end="url(#arrow-orange)"/>

  <!-- Stage 4: Augmented Generation -->
  <rect x="790" y="100" width="200" height="160" rx="10" fill="#fff" stroke="#2d3142" stroke-width="2.5"/>
  <rect x="790" y="100" width="200" height="28" rx="10" fill="#e3f2fd"/>
  <rect x="790" y="118" width="200" height="10" fill="#e3f2fd"/>
  <text x="890" y="120" text-anchor="middle" fill="#1565c0" font-family="'Comic Sans MS', cursive" font-size="12" font-weight="700">4. Augmented Gen</text>
  <text x="890" y="148" text-anchor="middle" fill="#2d3142" font-family="'Comic Sans MS', cursive" font-size="10">Context + Query</text>
  <text x="890" y="172" text-anchor="middle" fill="#2d3142" font-family="'Comic Sans MS', cursive" font-size="10">→ Prompt</text>
  <text x="890" y="200" text-anchor="middle" fill="#2d3142" font-family="'Comic Sans MS', cursive" font-size="10">LLM (Generator)</text>
  <text x="890" y="240" text-anchor="middle" fill="#2e7d32" font-family="'Comic Sans MS', cursive" font-size="10">Grounded Answer ✓</text>

  <!-- Retrieval Optimization -->
  <rect x="40" y="290" width="1080" height="80" rx="10" fill="#fff" stroke="#2d3142" stroke-width="2.5"/>
  <text x="560" y="315" text-anchor="middle" fill="#2d3142" font-family="'Comic Sans MS', cursive" font-size="13" font-weight="700">Retrieval Optimization</text>
  <text x="80" y="345" fill="#2d3142" font-family="'Comic Sans MS', cursive" font-size="11">Top-K Tuning</text>
  <text x="320" y="345" fill="#2d3142" font-family="'Comic Sans MS', cursive" font-size="11">Similarity Threshold</text>
  <text x="560" y="345" fill="#2d3142" font-family="'Comic Sans MS', cursive" font-size="11">Hybrid Search</text>
  <text x="800" y="345" fill="#2d3142" font-family="'Comic Sans MS', cursive" font-size="11">Metadata Filtering</text>
  <text x="1020" y="345" fill="#2d3142" font-family="'Comic Sans MS', cursive" font-size="11">Reranking (Cross-Encoder)</text>

  <!-- Error handling -->
  <rect x="40" y="400" width="330" height="80" rx="10" fill="#fff" stroke="#c62828" stroke-width="2"/>
  <text x="205" y="425" text-anchor="middle" fill="#c62828" font-family="'Comic Sans MS', cursive" font-size="12" font-weight="700">Error Paths</text>
  <text x="205" y="448" text-anchor="middle" fill="#2d3142" font-family="'Comic Sans MS', cursive" font-size="10">Irrelevant Context → Hallucination</text>
  <text x="205" y="466" text-anchor="middle" fill="#2d3142" font-family="'Comic Sans MS', cursive" font-size="10">Weak Prompt → Unsupported Claim</text>

  <!-- End-to-end summary -->
  <rect x="420" y="400" width="700" height="50" rx="25" fill="#e8f0fe" stroke="#2d3142" stroke-width="2"/>
  <text x="770" y="430" text-anchor="middle" fill="#2d3142" font-family="'Comic Sans MS', cursive" font-size="14" font-weight="600">Ingestion → Embedding → Retrieval → Augmentation → Generation</text>

  </g>
  <g>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#1565c0"/></marker>
  <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7b1fa2"/></marker>
  <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#e65100"/></marker>
  </g>
</svg>