<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <filter id="sketch"><feTurbulence type="turbulence" baseFrequency="0.02" numOctaves="3" result="turbulence"/><feDisplacementMap in="SourceGraphic" in2="turbulence" scale="1.5" xChannelSelector="R" yChannelSelector="G"/></filter>
  </defs>
  <rect width="1200" height="630" fill="#ffffff"/>
  <g filter="url(#sketch)">
  <text x="600" y="50" text-anchor="middle" fill="#2d3142" font-family="'Comic Sans MS', 'Marker Felt', cursive" font-size="28" font-weight="700">Building an AI Agent with LangChain</text>
  <text x="600" y="72" text-anchor="middle" fill="#4f5d75" font-family="'Comic Sans MS', cursive" font-size="14">LLM + Tools + Memory + Reasoning Loop</text>

  <!-- User Input -->
  <circle cx="180" cy="120" r="30" fill="#e8f0fe" stroke="#2d3142" stroke-width="2.5"/>
  <text x="180" y="125" text-anchor="middle" fill="#2d3142" font-family="'Comic Sans MS', cursive" font-size="12" font-weight="600">USER</text>
  <path d="M 210 120 L 260 120" stroke="#2d3142" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Memory -->
  <rect x="60" y="180" width="220" height="80" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="170" y="202" text-anchor="middle" fill="#2e7d32" font-family="'Comic Sans MS', cursive" font-size="13" font-weight="600">Conversation Memory</text>
  <text x="170" y="220" text-anchor="middle" fill="#2d3142" font-family="'Comic Sans MS', cursive" font-size="10">Previous Question</text>
  <text x="170" y="236" text-anchor="middle" fill="#2d3142" font-family="'Comic Sans MS', cursive" font-size="10">Previous Answer</text>
  <text x="170" y="252" text-anchor="middle" fill="#2d3142" font-family="'Comic Sans MS', cursive" font-size="10">User Context · Conversation History</text>
  <path d="M 280 200 L 320 200" stroke="#2e7d32" stroke-width="2" stroke-dasharray="5,3"/>

  <!-- Agent Brain -->
  <rect x="330" y="80" width="300" height="180" rx="16" fill="#f8f9fa" stroke="#2d3142" stroke-width="3"/>
  <text x="480" y="108" text-anchor="middle" fill="#2d3142" font-family="'Comic Sans MS', cursive" font-size="18" font-weight="700">LangChain Agent</text>

  <text x="480" y="135" text-anchor="middle" fill="#1565c0" font-family="'Comic Sans MS', cursive" font-size="11" font-weight="600">1. Think / Plan</text>
  <text x="480" y="155" text-anchor="middle" fill="#1565c0" font-family="'Comic Sans MS', cursive" font-size="11" font-weight="600">2. Select Tool</text>
  <text x="480" y="175" text-anchor="middle" fill="#1565c0" font-family="'Comic Sans MS', cursive" font-size="11" font-weight="600">3. Tool Execution</text>
  <text x="480" y="195" text-anchor="middle" fill="#1565c0" font-family="'Comic Sans MS', cursive" font-size="11" font-weight="600">4. Observation</text>
  <text x="480" y="215" text-anchor="middle" fill="#1565c0" font-family="'Comic Sans MS', cursive" font-size="11" font-weight="600">5. Reason Again</text>
  <text x="480" y="235" text-anchor="middle" fill="#1565c0" font-family="'Comic Sans MS', cursive" font-size="11" font-weight="600">6. Final Answer</text>

  <!-- Loop arrow -->
  <path d="M 615 230 Q 670 230 670 130 Q 670 115 645 115" fill="none" stroke="#1565c0" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-blue)"/>
  <text x="685" y="180" fill="#1565c0" font-family="'Comic Sans MS', cursive" font-size="10" transform="rotate(90,685,180)">Loop</text>

  <!-- Tools -->
  <rect x="700" y="80" width="220" height="180" rx="10" fill="#fff" stroke="#2d3142" stroke-width="2.5"/>
  <text x="810" y="105" text-anchor="middle" fill="#e65100" font-family="'Comic Sans MS', cursive" font-size="14" font-weight="700">Tools</text>
  <text x="810" y="128" text-anchor="middle" fill="#2d3142" font-family="'Comic Sans MS', cursive" font-size="11">Search Tool</text>
  <text x="810" y="148" text-anchor="middle" fill="#2d3142" font-family="'Comic Sans MS', cursive" font-size="11">Calculator</text>
  <text x="810" y="168" text-anchor="middle" fill="#2d3142" font-family="'Comic Sans MS', cursive" font-size="11">Database</text>
  <text x="810" y="188" text-anchor="middle" fill="#2d3142" font-family="'Comic Sans MS', cursive" font-size="11">API</text>
  <text x="810" y="208" text-anchor="middle" fill="#2d3142" font-family="'Comic Sans MS', cursive" font-size="11">Web Search</text>
  <text x="810" y="228" text-anchor="middle" fill="#2d3142" font-family="'Comic Sans MS', cursive" font-size="11">Custom Tool</text>
  <path d="M 630 170 L 695 170" stroke="#e65100" stroke-width="2.5" marker-end="url(#arrow-orange)"/>

  <!-- Error Handling -->
  <rect x="700" y="290" width="220" height="120" rx="10" fill="#fff" stroke="#c62828" stroke-width="2.5"/>
  <text x="810" y="315" text-anchor="middle" fill="#c62828" font-family="'Comic Sans MS', cursive" font-size="13" font-weight="700">Error Handling</text>
  <text x="810" y="338" text-anchor="middle" fill="#2d3142" font-family="'Comic Sans MS', cursive" font-size="11">Tool Failed</text>
  <text x="810" y="358" text-anchor="middle" fill="#2d3142" font-family="'Comic Sans MS', cursive" font-size="11">→ Retry</text>
  <text x="810" y="378" text-anchor="middle" fill="#2d3142" font-family="'Comic Sans MS', cursive" font-size="11">→ Alternative Tool</text>
  <text x="810" y="398" text-anchor="middle" fill="#2d3142" font-family="'Comic Sans MS', cursive" font-size="11">→ Final Response</text>

  <!-- Multi-turn Example -->
  <rect x="60" y="300" width="540" height="150" rx="10" fill="#fff" stroke="#2d3142" stroke-width="2.5"/>
  <text x="330" y="325" text-anchor="middle" fill="#2d3142" font-family="'Comic Sans MS', cursive" font-size="14" font-weight="700">Multi-turn Conversation Example</text>

  <text x="80" y="350" fill="#2d3142" font-family="'Comic Sans MS', cursive" font-size="11">Turn 1: User: "帮我查询昨天的天气"</text>
  <text x="80" y="368" fill="#1565c0" font-family="'Comic Sans MS', cursive" font-size="11">  Agent: 需要调用天气工具 → Weather API</text>
  <text x="80" y="386" fill="#2e7d32" font-family="'Comic Sans MS', cursive" font-size="11">  Observation: 多云, 18~26℃</text>

  <text x="80" y="410" fill="#2d3142" font-family="'Comic Sans MS', cursive" font-size="11">Turn 2: User: "那今天呢？"</text>
  <text x="80" y="428" fill="#1565c0" font-family="'Comic Sans MS', cursive" font-size="11">  Agent: 根据上下文，用户仍询问相同地点 → 调用天气工具</text>
  <text x="80" y="446" fill="#2e7d32" font-family="'Comic Sans MS', cursive" font-size="11">  Observation: 晴, 20~29℃</text>

  <!-- Bottom formula -->
  <rect x="200" y="480" width="800" height="50" rx="25" fill="#e8f0fe" stroke="#2d3142" stroke-width="2"/>
  <text x="600" y="510" text-anchor="middle" fill="#2d3142" font-family="'Comic Sans MS', cursive" font-size="14" font-weight="600"># LangChain Agent = LLM + Tools + Memory + Reasoning Loop</text>

  </g>
  <g>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2d3142"/></marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#1565c0"/></marker>
  <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#e65100"/></marker>
  </g>
</svg>