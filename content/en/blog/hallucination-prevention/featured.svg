<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <filter id="sketch"><feTurbulence type="turbulence" baseFrequency="0.02" numOctaves="3" result="turbulence"/><feDisplacementMap in="SourceGraphic" in2="turbulence" scale="1.5" xChannelSelector="R" yChannelSelector="G"/></filter>
  </defs>
  <rect width="1200" height="630" fill="#ffffff"/>
  <g filter="url(#sketch)">
  <!-- Title -->
  <text x="600" y="52" text-anchor="middle" fill="#2d3142" font-family="'Comic Sans MS', 'Marker Felt', cursive" font-size="28" font-weight="700">RAG Hallucination Prevention</text>
  <text x="600" y="75" text-anchor="middle" fill="#4f5d75" font-family="'Comic Sans MS', cursive" font-size="14">Retrieve → Constrain → Validate</text>

  <!-- ====== User Question ====== -->
  <rect x="480" y="100" width="240" height="44" rx="22" fill="#e8f0fe" stroke="#2d3142" stroke-width="2.5"/>
  <text x="600" y="127" text-anchor="middle" fill="#2d3142" font-family="'Comic Sans MS', cursive" font-size="16" font-weight="600">User Question</text>
  <path d="M 600 144 L 600 170" stroke="#2d3142" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ====== Query Understanding ====== -->
  <rect x="420" y="175" width="360" height="50" rx="8" fill="#f8f9fa" stroke="#2d3142" stroke-width="2.5"/>
  <text x="600" y="200" text-anchor="middle" fill="#2d3142" font-family="'Comic Sans MS', cursive" font-size="14" font-weight="600">Query Understanding</text>
  <text x="600" y="216" text-anchor="middle" fill="#4f5d75" font-family="'Comic Sans MS', cursive" font-size="10">Intent · Rewrite · Expand · Extract Keywords</text>
  <path d="M 600 225 L 600 260" stroke="#2d3142" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ====== Center: Knowledge Base ====== -->
  <rect x="60" y="270" width="240" height="60" rx="10" fill="#e8f0fe" stroke="#2d3142" stroke-width="2.5"/>
  <text x="180" y="298" text-anchor="middle" fill="#2d3142" font-family="'Comic Sans MS', cursive" font-size="14" font-weight="600">Knowledge Base</text>
  <text x="180" y="316" text-anchor="middle" fill="#4f5d75" font-family="'Comic Sans MS', cursive" font-size="10">Vector DB (ChromaDB/Redis)</text>

  <path d="M 300 300 L 380 300" stroke="#2d3142" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ====== Defense 1: Retrieval Filtering ====== -->
  <rect x="390" y="270" width="420" height="130" rx="12" fill="#fff" stroke="#2d3142" stroke-width="3"/>
  <rect x="390" y="270" width="420" height="32" rx="12" fill="#e3f2fd"/>
  <rect x="390" y="290" width="420" height="12" fill="#e3f2fd"/>
  <text x="600" y="291" text-anchor="middle" fill="#1565c0" font-family="'Comic Sans MS', cursive" font-size="14" font-weight="700">Defense 1: Retrieval Filtering</text>

  <text x="600" y="320" text-anchor="middle" fill="#2d3142" font-family="'Comic Sans MS', cursive" font-size="11">Similarity Scoring · Top-K Selection · Relevance Filter</text>
  <text x="600" y="338" text-anchor="middle" fill="#2d3142" font-family="'Comic Sans MS', cursive" font-size="11">Quality Filter · Deduplication</text>

  <!-- Funnel -->
  <path d="M 530 360 L 600 390 L 670 360 Z" fill="none" stroke="#1565c0" stroke-width="2.5"/>
  <text x="600" y="385" text-anchor="middle" fill="#1565c0" font-family="'Comic Sans MS', cursive" font-size="10">FILTER</text>

  <path d="M 600 400 L 600 430" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

  <!-- ====== Defense 2: Prompt Engineering ====== -->
  <rect x="390" y="420" width="420" height="110" rx="12" fill="#fff" stroke="#2d3142" stroke-width="3"/>
  <rect x="390" y="420" width="420" height="32" rx="12" fill="#fff3e0"/>
  <rect x="390" y="440" width="420" height="12" fill="#fff3e0"/>
  <text x="600" y="441" text-anchor="middle" fill="#e65100" font-family="'Comic Sans MS', cursive" font-size="14" font-weight="700">Defense 2: Prompt Engineering</text>

  <text x="600" y="468" text-anchor="middle" fill="#2d3142" font-family="'Comic Sans MS', cursive" font-size="11">System Prompt · Instructions · Evidence/Context</text>
  <text x="600" y="486" text-anchor="middle" fill="#2d3142" font-family="'Comic Sans MS', cursive" font-size="11">Answer Constraints · "Only based on context"</text>
  <text x="600" y="504" text-anchor="middle" fill="#2d3142" font-family="'Comic Sans MS', cursive" font-size="11">Output Format · Citation Requirement</text>

  <path d="M 600 530 L 600 560" stroke="#e65100" stroke-width="2.5" marker-end="url(#arrow-orange)"/>

  <!-- ====== Defense 3: Output Validation ====== -->
  <rect x="390" y="555" width="420" height="75" rx="12" fill="#fff" stroke="#2d3142" stroke-width="3"/>
  <rect x="390" y="555" width="420" height="32" rx="12" fill="#e8f5e9"/>
  <rect x="390" y="575" width="420" height="12" fill="#e8f5e9"/>
  <text x="600" y="576" text-anchor="middle" fill="#2e7d32" font-family="'Comic Sans MS', cursive" font-size="14" font-weight="700">Defense 3: Output Validation</text>

  <text x="600" y="600" text-anchor="middle" fill="#2d3142" font-family="'Comic Sans MS', cursive" font-size="11">Fact Check · Citation Check · Hallucination Detection</text>
  <text x="600" y="616" text-anchor="middle" fill="#2d3142" font-family="'Comic Sans MS', cursive" font-size="11">Consistency Check · Confidence Scoring · Safety Check</text>

  <!-- ====== Result ====== -->
  <rect x="480" y="640" width="240" height="44" rx="22" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="600" y="667" text-anchor="middle" fill="#2e7d32" font-family="'Comic Sans MS', cursive" font-size="16" font-weight="700">Grounded Answer ✓</text>

  </g>
  <g>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2d3142"/></marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#1565c0"/></marker>
  <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#e65100"/></marker>
  </g>
</svg>