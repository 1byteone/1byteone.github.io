<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a0a2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="box1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a3e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a1a4e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1" />
      <stop offset="100%" style="stop-color:#8b5cf6" />
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4" />
      <stop offset="100%" style="stop-color:#3b82f6" />
    </linearGradient>
    <linearGradient id="accent3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b" />
      <stop offset="100%" style="stop-color:#ef4444" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Title -->
  <text x="600" y="55" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="700" filter="url(#glow)">RAG Pipeline Architecture</text>
  <text x="600" y="80" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">Document Processing → Vector Storage → Retrieval → Generation</text>

  <!-- Phase 1: Document Processing -->
  <rect x="60" y="110" width="240" height="80" rx="12" fill="url(#box1)" stroke="url(#accent1)" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="140" text-anchor="middle" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="14" font-weight="600">📄 Document Processing</text>
  <text x="180" y="160" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">PDF / HTML / Markdown</text>
  <text x="180" y="176" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Text Splitting & Chunking</text>

  <!-- Arrow 1→2 -->
  <path d="M 300 150 L 340 150" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow1)"/>
  <defs>
    <marker id="arrow1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#6366f1"/>
    </marker>
  </defs>

  <!-- Phase 2: Embedding -->
  <rect x="350" y="110" width="240" height="80" rx="12" fill="url(#box1)" stroke="url(#accent2)" stroke-width="2" filter="url(#shadow)"/>
  <text x="470" y="140" text-anchor="middle" fill="#67e8f9" font-family="system-ui, sans-serif" font-size="14" font-weight="600">🔢 Vector Embedding</text>
  <text x="470" y="160" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">OpenAI / HuggingFace</text>
  <text x="470" y="176" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Token → Vector Conversion</text>

  <!-- Arrow 2→3 -->
  <path d="M 590 150 L 630 150" stroke="#06b6d4" stroke-width="2"/>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#06b6d4"/>
    </marker>
  </defs>

  <!-- Phase 3: Vector Store -->
  <rect x="640" y="110" width="240" height="80" rx="12" fill="url(#box1)" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <text x="760" y="140" text-anchor="middle" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="14" font-weight="600">💾 Vector Store</text>
  <text x="760" y="160" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">ChromaDB / RedisStack</text>
  <text x="760" y="176" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Index & Persist Vectors</text>

  <!-- Arrow 3→4 -->
  <path d="M 880 150 L 920 150" stroke="#f59e0b" stroke-width="2"/>
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Phase 4: Generation -->
  <rect x="930" y="110" width="210" height="80" rx="12" fill="url(#box1)" stroke="#ef4444" stroke-width="2" filter="url(#shadow)"/>
  <text x="1035" y="140" text-anchor="middle" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="14" font-weight="600">🤖 LLM Generation</text>
  <text x="1035" y="160" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">GPT-4 / Local LLM</text>
  <text x="1035" y="176" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Context + Query → Answer</text>

  <!-- ====== User Query Section ====== -->
  <rect x="60" y="240" width="240" height="70" rx="12" fill="url(#box1)" stroke="#8b5cf6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="180" y="268" text-anchor="middle" fill="#c4b5fd" font-family="system-ui, sans-serif" font-size="14" font-weight="600">🔍 User Query</text>
  <text x="180" y="288" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">"Best practices for..."</text>

  <!-- Arrow: Query → Retrieval -->
  <path d="M 300 275 L 340 275" stroke="#8b5cf6" stroke-width="2"/>
  <defs>
    <marker id="arrow4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#8b5cf6"/>
    </marker>
  </defs>

  <!-- Retrieval Section -->
  <rect x="350" y="240" width="240" height="70" rx="12" fill="url(#box1)" stroke="#06b6d4" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="470" y="268" text-anchor="middle" fill="#67e8f9" font-family="system-ui, sans-serif" font-size="14" font-weight="600">📡 Similarity Search</text>
  <text x="470" y="288" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Cosine Similarity / MMR</text>

  <!-- Arrow: Retrieval → Context -->
  <path d="M 590 275 L 630 275" stroke="#06b6d4" stroke-width="2"/>

  <!-- Context Assembly -->
  <rect x="640" y="240" width="240" height="70" rx="12" fill="url(#box1)" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="760" y="268" text-anchor="middle" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="14" font-weight="600">📋 Context Assembly</text>
  <text x="760" y="288" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Top-K Chunks + Query</text>

  <!-- Arrow: Context → Answer -->
  <path d="M 880 275 L 920 275" stroke="#f59e0b" stroke-width="2"/>

  <!-- Answer -->
  <rect x="930" y="240" width="210" height="70" rx="12" fill="url(#box1)" stroke="#22c55e" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1035" y="268" text-anchor="middle" fill="#86efac" font-family="system-ui, sans-serif" font-size="14" font-weight="600">✅ Generated Answer</text>
  <text x="1035" y="288" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Structured Response</text>

  <!-- ====== Retrieval Strategies Section ====== -->
  <text x="600" y="360" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="600" filter="url(#glow)">Retrieval Strategies</text>

  <!-- Strategy cards -->
  <rect x="60" y="390" width="240" height="90" rx="12" fill="url(#box1)" stroke="#6366f1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="180" y="418" text-anchor="middle" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Basic Similarity</text>
  <text x="180" y="438" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Simple cosine similarity</text>
  <text x="180" y="454" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Fast but less accurate</text>
  <text x="180" y="470" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">search_type="similarity"</text>

  <rect x="340" y="390" width="240" height="90" rx="12" fill="url(#box1)" stroke="#06b6d4" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="460" y="418" text-anchor="middle" fill="#67e8f9" font-family="system-ui, sans-serif" font-size="13" font-weight="600">MMR Diversification</text>
  <text x="460" y="438" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Balance relevance & diversity</text>
  <text x="460" y="454" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Reduce redundancy</text>
  <text x="460" y="470" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">search_type="mmr"</text>

  <rect x="620" y="390" width="240" height="90" rx="12" fill="url(#box1)" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="740" y="418" text-anchor="middle" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Contextual Compression</text>
  <text x="740" y="438" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">LLM extracts relevant parts</text>
  <text x="740" y="454" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Higher accuracy</text>
  <text x="740" y="470" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">ContextualCompression</text>

  <rect x="900" y="390" width="240" height="90" rx="12" fill="url(#box1)" stroke="#22c55e" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1020" y="418" text-anchor="middle" fill="#86efac" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Hybrid Search</text>
  <text x="1020" y="438" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Vector + Keyword combined</text>
  <text x="1020" y="454" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Best overall accuracy</text>
  <text x="1020" y="470" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">EnsembleRetriever</text>

  <!-- Footer -->
  <rect x="0" y="510" width="1200" height="120" fill="#0a0a1a" fill-opacity="0.5"/>
  <text x="600" y="550" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">LangChain RAG Pipeline — Document Processing to Vector Search</text>
  <text x="600" y="575" text-anchor="middle" fill="#475569" font-family="system-ui, sans-serif" font-size="11">1byteone.github.io | AI Application Developer Portfolio</text>
</svg>