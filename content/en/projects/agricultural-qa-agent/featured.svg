<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a2e1a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="box1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a3e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a2e1a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e" />
      <stop offset="100%" style="stop-color:#16a34a" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1" />
      <stop offset="100%" style="stop-color:#8b5cf6" />
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b" />
      <stop offset="100%" style="stop-color:#ef4444" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <text x="600" y="55" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="700" filter="url(#glow)">Agri-QA-Assistant Architecture</text>
  <text x="600" y="80" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">LangGraph Goal-Oriented Agent · RAG · MCP Integration</text>

  <!-- Frontend -->
  <rect x="350" y="110" width="500" height="60" rx="12" fill="url(#box1)" stroke="url(#grad1)" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="138" text-anchor="middle" fill="#86efac" font-family="system-ui, sans-serif" font-size="14" font-weight="700">🎨 Frontend: Next.js 14 + Apple Liquid Glass UI</text>
  <text x="600" y="158" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Frosted Glass · iOS Animation · Responsive</text>

  <path d="M 600 170 L 600 200" stroke="#22c55e" stroke-width="2" marker-end="url(#a)"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#22c55e"/></marker></defs>

  <!-- Backend Core -->
  <rect x="200" y="210" width="800" height="100" rx="16" fill="url(#box1)" stroke="url(#grad2)" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="240" text-anchor="middle" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="18" font-weight="700">⚙️ Backend: FastAPI + LangGraph Agent</text>

  <rect x="230" y="258" width="230" height="40" rx="8" fill="#1a1a3e" stroke="#6366f1" stroke-width="1"/>
  <text x="345" y="283" text-anchor="middle" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">🎯 Intent Router</text>

  <rect x="485" y="258" width="230" height="40" rx="8" fill="#1a1a3e" stroke="#06b6d4" stroke-width="1"/>
  <text x="600" y="283" text-anchor="middle" fill="#67e8f9" font-family="system-ui, sans-serif" font-size="12" font-weight="600">🔧 Tool Executor</text>

  <rect x="740" y="258" width="230" height="40" rx="8" fill="#1a1a3e" stroke="#f59e0b" stroke-width="1"/>
  <text x="855" y="283" text-anchor="middle" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="600">📊 RAG Pipeline</text>

  <path d="M 600 310 L 600 340" stroke="#6366f1" stroke-width="2" marker-end="url(#a)"/>

  <!-- Three Processing Paths -->
  <text x="600" y="365" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="600" filter="url(#glow)">Processing Paths</text>

  <path d="M 200 310 L 200 380 L 160 380" stroke="#06b6d4" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M 600 310 L 600 380" stroke="#f59e0b" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M 1000 310 L 1000 380 L 1040 380" stroke="#22c55e" stroke-width="1.5" fill="none" marker-end="url(#a)"/>

  <rect x="60" y="390" width="240" height="90" rx="12" fill="url(#box1)" stroke="#06b6d4" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="180" y="418" text-anchor="middle" fill="#67e8f9" font-family="system-ui, sans-serif" font-size="13" font-weight="600">🌱 RAG Path</text>
  <text x="180" y="438" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">ChromaDB vector search</text>
  <text x="180" y="454" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Agricultural knowledge base</text>
  <text x="180" y="470" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">evidence_grounding</text>

  <rect x="480" y="390" width="240" height="90" rx="12" fill="url(#box1)" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="600" y="418" text-anchor="middle" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13" font-weight="600">🧠 General Knowledge</text>
  <text x="600" y="438" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">LLM direct answering</text>
  <text x="600" y="454" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Knowledge base fallback</text>
  <text x="600" y="470" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">general_knowledge</text>

  <rect x="900" y="390" width="240" height="90" rx="12" fill="url(#box1)" stroke="#22c55e" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1020" y="418" text-anchor="middle" fill="#86efac" font-family="system-ui, sans-serif" font-size="13" font-weight="600">🔧 Tool Augmented</text>
  <text x="1020" y="438" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">MCP servers</text>
  <text x="1020" y="454" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Web fetch · Temporal</text>
  <text x="1020" y="470" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">tool_executor</text>

  <!-- Bottom features -->
  <rect x="60" y="510" width="340" height="60" rx="12" fill="url(#box1)" stroke="#22c55e" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="230" y="538" text-anchor="middle" fill="#86efac" font-family="system-ui, sans-serif" font-size="13" font-weight="600">💬 Multi-turn Memory</text>
  <text x="230" y="556" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">SQLite · Session Isolation</text>

  <rect x="430" y="510" width="340" height="60" rx="12" fill="url(#box1)" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="600" y="538" text-anchor="middle" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13" font-weight="600">📊 Evidence Grounding</text>
  <text x="600" y="556" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Citation · Faithfulness Scoring</text>

  <rect x="800" y="510" width="340" height="60" rx="12" fill="url(#box1)" stroke="#6366f1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="970" y="538" text-anchor="middle" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">⚡ SSE Streaming</text>
  <text x="970" y="556" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Real-time Token-by-Token</text>

  <rect x="0" y="620" width="1200" height="10" fill="#0a0a1a"/>
</svg>